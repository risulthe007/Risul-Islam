<!DOCTYPE html>
<html>
<head>
<title>Lasers and Feelings</title>
</head>
<body>

<h1>Lasers and Feelings Companion App</h1>

<h2>Player</h2>
<p>Your number:</p>
<input type="number" id="playerNumber" value="3">
<button onclick="rollPlayerDice()">Roll Dice</button>
<p id="playerResult"></p>
<h3>Character</h3>
<label for="charName">Character name:</label>
<input type="text" id="charName" placeholder="Enter a name">
<button onclick="setName()">Set name</button>
<p id="nameDisplay"></p>
<br>
<label for="charStyle">Style:</label>
<select id="charStyle">
  <option>Alien</option>
  <option>Android</option>
  <option>Dangerous</option>
  <option>Heroic</option>
  <option>Hot-Headed</option>
  <option>Intrepid</option>
  <option>Savvy</option>
</select>

<label for="charRole">Role:</label>
<select id="charRole">
  <option>Doctor</option>
  <option>Envoy</option>
  <option>Engineer</option>
  <option>Explorer</option>
  <option>Pilot</option>
  <option>Science Officer</option>
</select>
<button onclick="setStyleRole()">Set style and role</button>
<p id="styleRoleDisplay"></p>

<h2>GM</h2>
<button onclick="rollGMDice()">Roll Dice</button>
<p id="gmResult"></p>

<script>
function rollPlayerDice() {
  var roll = Math.floor(Math.random() * 6) + 1;
  var number = document.getElementById("playerNumber").value;
  document.getElementById("playerResult").innerHTML = "You rolled " + roll + " and your number is " + number;
}
function setName() {
  var name = document.getElementById("charName").value.trim();
  if (name === "") {
    document.getElementById("nameDisplay").innerHTML = "Please enter a name.";
    return;
  }
  document.getElementById("nameDisplay").innerHTML = "Your character is " + name + ".";
}
function setStyleRole() {
  var style = document.getElementById("charStyle").value;
  var role = document.getElementById("charRole").value;
  document.getElementById("styleRoleDisplay").innerHTML = "Style: " + style + ", Role: " + role;
}

function rollGMDice() {
  var roll = Math.floor(Math.random() * 6) + 1;
  document.getElementById("gmResult").innerHTML = "GM rolled " + roll;
}
</script>

</body>
</html>
